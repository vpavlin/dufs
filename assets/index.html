<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141416" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dufs" />
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <title>Dufs</title>
  <link rel="icon" type="image/svg+xml" href="__ASSETS_PREFIX__icon.svg">
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="apple-touch-icon" href="__ASSETS_PREFIX__icon-192.png">
  <link rel="manifest" href="__ASSETS_PREFIX__manifest.webmanifest">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
</head>

<body>
  <div id="app">
    <!-- servers / places -->
    <aside id="side">
      <div class="side-head">
        <span class="brand">Dufs</span>
        <span id="version" class="faint small"></span>
        <button id="side-close" class="icon-btn only-narrow" title="Close">✕</button>
      </div>
      <div class="label">SERVER</div>
      <div id="server-card" class="server active">
        <div id="server-name" class="server-name"></div>
        <div id="server-line" class="faint small ellip"></div>
      </div>
      <div id="account" class="account"></div>
      <div id="places" class="places"></div>
      <div id="transfers" class="transfers hidden">
        <div class="label row"><span class="grow">TRANSFERS</span><button id="transfers-clear" class="link small">Clear done</button></div>
        <div id="transfer-list"></div>
      </div>
      <div id="install" class="install hidden">
        <button id="install-btn" class="btn wide">Install as an app</button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <!-- browser -->
    <main id="browser">
      <header id="toolbar">
        <button id="menu-btn" class="icon-btn only-narrow" title="Menu">☰</button>
        <input id="addr" class="field grow hidden" type="text" autocomplete="off" spellcheck="false"
          placeholder="Paste a dufs address or path, then Enter">
        <nav id="crumbs" class="crumbs grow"></nav>
        <form id="search-form" class="search">
          <input id="search" class="field" type="search" autocomplete="off" placeholder="Search here and below">
          <button type="button" id="search-clear" class="clear-x hidden" title="Clear search">✕</button>
        </form>
        <button id="search-btn" class="icon-btn only-narrow" title="Search">⌕</button>
        <button id="pin-btn" class="btn sq only-wide" title="Pin this folder">☆</button>
        <button id="goto-btn" class="btn only-wide">Go to…</button>
        <button id="view-btn" class="btn only-wide">Grid</button>
        <button id="mkdir-btn" class="btn only-wide">New folder</button>
        <button id="upload-btn" class="btn only-wide">Upload</button>
        <button id="refresh-btn" class="btn sq only-wide" title="Refresh">↻</button>
        <button id="more-btn" class="icon-btn only-narrow" title="More">⋯</button>
      </header>
      <div id="loadbar" class="loadbar hidden"><div></div></div>
      <div id="banner" class="banner hidden"></div>

      <div id="body">
        <section id="listarea">
          <div id="list-head" class="list-head">
            <button data-sort="name" class="grow">Name</button>
            <button data-sort="size" class="c-size">Size</button>
            <button data-sort="mtime" class="c-date">Modified</button>
            <span class="c-act"></span>
          </div>
          <div id="up-row" class="row up hidden"><span class="glyph">↰</span><span class="name">..</span></div>
          <div id="list" class="list"></div>
          <div id="empty" class="empty hidden"></div>
          <div id="drop" class="drop hidden"><div id="drop-text"></div></div>
        </section>

        <!-- preview -->
        <div id="pv-divider" class="divider hidden"></div>
        <section id="preview" class="hidden">
          <div class="pv-head">
            <button id="pv-back" class="icon-btn only-narrow" title="Back">←</button>
            <div id="pv-name" class="pv-name grow"></div>
            <button id="pv-close" class="icon-btn only-wide" title="Close">✕</button>
          </div>
          <div id="pv-meta" class="faint small"></div>
          <div id="pv-tabs" class="tabs hidden">
            <button data-src="0" class="on">Rendered</button>
            <button data-src="1">Source</button>
          </div>
          <div id="pv-body" class="pv-body"></div>
          <div id="pv-actions" class="pv-actions"></div>
        </section>
      </div>

      <button id="fab" class="fab only-narrow hidden" title="Upload">＋</button>
      <div id="share-bar" class="share-bar hidden"></div>
    </main>
  </div>

  <!-- menus, dialogs -->
  <div id="menu" class="menu hidden"></div>
  <div id="dialog" class="dialog-wrap hidden">
    <div class="dialog" role="dialog" aria-modal="true">
      <div id="dlg-title" class="dlg-title"></div>
      <div id="dlg-text" class="dlg-text"></div>
      <input id="dlg-input" class="field hidden" type="text" autocomplete="off" spellcheck="false">
      <div id="dlg-buttons" class="dlg-buttons"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <input id="file-input" type="file" multiple hidden>
  <input id="dir-input" type="file" webkitdirectory multiple hidden>

  <template id="index-data">__INDEX_DATA__</template>
  <script>window.DUFS_ASSETS = "__ASSETS_PREFIX__";</script>
  <script src="__ASSETS_PREFIX__index.js"></script>
</body>

</html>
